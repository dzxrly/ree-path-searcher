[package]
name = "ree-path-searcher"
version = "0.3.2"
edition = "2024"

[lib]
name = "ree_path_searcher"
path = "src/lib.rs"

[[bin]]
name = "ree-path-searcher"
path = "src/main.rs"

[dependencies]
# Patched core 0.8.0 with remap entry support.
ree-pak-core = { git = "https://github.com/dzxrly/ree-pak-rs.git", rev = "fef67eca78721b6f86fe2027c8f2e37e44c787d1", package = "ree-pak-core" }

clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
memchr = "2.8"
minidump = "0.26"
parking_lot = "0.12"
rayon = "1.10"
rustc-hash = "2.1"
indicatif = "0.18"
dashmap = "6.1"
num_cpus = "1.17.0"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[features]
default = []

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "search_performance"
harness = false
